
name: Django Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hms
          MYSQL_USER: hms
          MYSQL_PASSWORD: hms_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-test-only-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: hms
      DB_USER: hms
      DB_PASSWORD: hms_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_SECURE_SSL_REDIRECT: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install MySQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Grant MySQL test database permissions
        run: |
          mysql -h 127.0.0.1 -uroot -proot_test_password <<'SQL'
          GRANT ALL PRIVILEGES ON `test\_hms`.* TO 'hms'@'%';
          SQL

      - name: Apply migrations to a fresh application database
        run: python manage.py migrate --noinput

      - name: Check lint, configuration, migrations, tests and branch coverage
        run: python scripts/run_checks.py --output-dir test-results/ci

      - name: Check backup and recovery safety without external operations
        run: python -m unittest discover -s scripts/part3 -p test_issue40_recovery_safety.py -v

      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hms-test-evidence-py${{ matrix.python-version }}-${{ github.sha }}
          path: test-results/ci/
          if-no-files-found: error
          retention-days: 30
