<title id="title">HMS sprint burndown</title>
<desc id="desc">Sprint 1 reached zero remaining story points on 23 October. The original Sprint 2 backlog reached zero on 28 October, using merged PRs as an acceptance proxy. HMS-13 has acceptance evidence gaps recorded in the submission checklist. HMS-14 is an unestimated follow-up outside the original baseline. The 30 October daily actual was not recorded.</desc>
