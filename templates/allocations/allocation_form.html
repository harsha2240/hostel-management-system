{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<section class="narrow">
  <h1>{{ heading }}</h1>
  {% if allocation %}
  <p>{{ allocation.student.name }} · {{ allocation.bed }}</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {% include "includes/form.html" %}
    <button type="submit">Confirm</button>
    <a class="button secondary" href="{% url 'allocation-list' %}">Cancel</a>
  </form>
</section>
{% endblock %}
